name: Frontend quality

on:
  pull_request:
  push:
    branches: [main, "codex/**", site/footer-icons-features-council]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run loop:validate
      - run: npm run test:loop
      - run: npm run test:readiness
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:contracts
      - run: npm run build
      - run: npm run performance:budget
